<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mesas Abiertas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="../config.js"></script>
  <script src="qrcode.min.js"></script>
  <style>
    :root {
      --primary-color: #2196F3;
      --secondary-color: #4CAF50;
      --background-color: #f5f5f5;
      --text-color: #333;
      --border-color: #ddd;
      --button-height: 48px;
      --header-height: 60px;
      --shadow-color: rgba(0,0,0,0.1);
      --timeout-cierre-mesa: 3000; /* 3 segundos - MODIFICAR AQUÍ */
      --timeout-polling: 3000; /* 60 segundos - MODIFICAR AQUÍ */
      --intervalo-polling: 1000; /* 1 segundo - MODIFICAR AQUÍ */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header-section {
      background: var(--primary-color);
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px var(--shadow-color);
    }

    .back-button {
      background: #FF9800;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 1em;
      font-weight: bold;
      transition: background 0.2s;
    }

    .back-button:hover {
      background: #E68A00;
    }

    .logo-header {
      flex-grow: 1;
      text-align: center;
    }

    .logo-text {
      font-size: 1.5em;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin: 20px 0;
      font-size: 2em;
    }

    .search-section {
      padding: 10px 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .search-section h3 {
      color: var(--text-color);
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      max-width: 300px;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      font-size: 1.1em;
      text-align: center;
    }

    #table-overview-container {
      flex-grow: 1; /* Permite que el contenedor de mesas ocupe el espacio restante */
      height: 80vh; /* 80% de la altura de la vista */
      overflow-y: auto; /* Habilita el scroll vertical */
      padding: 20px;
      display: flex; /* Usar flexbox para centrar y manejar el flujo */
      justify-content: center; /* Centrar horizontalmente el contenido */
      align-items: flex-start; /* Alinear arriba el contenido */
    }

    #table-overview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1200px; /* Limita el ancho para pantallas grandes */
      width: 100%; /* Asegura que ocupe el ancho disponible dentro del contenedor */
    }

    .table-card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px var(--shadow-color);
      padding: 15px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 120px; /* Altura fija para las tarjetas */
    }

    .table-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 10px var(--shadow-color);
    }

    .table-id {
      font-size: 2.2em;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .table-waiter {
      font-size: 1em;
      color: #666;
    }

    /* Estilos para el detalle de la mesa - Manteniendo el estilo existente si es necesario */
    #table-detail {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px var(--shadow-color);
      padding: 20px;
      margin: 20px;
      display: none; /* Oculto por defecto */
    }

    #table-detail h2 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--primary-color);
    }

    .detail-label {
      font-weight: bold;
      color: #555;
    }

    .detail-value {
      color: var(--text-color);
    }

    .order-items-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .order-items-table th,
    .order-items-table td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .order-items-table th {
      background: #f8f9fa;
      font-weight: 600;
    }

    .nav-btns {
      display: flex;
      justify-content: space-around;
      gap: 10px;
      margin-top: 20px;
    }

    .nav-btns button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      flex: 1; /* Para que los botones ocupen el mismo espacio */
    }

    .nav-btns button:hover {
      opacity: 0.9;
    }

    .nav-btns button:nth-child(1) { background: #607D8B; } /* Volver */
    .nav-btns button:nth-child(2) { background: var(--primary-color); } /* Inicio */
    #emitirCuentaBtn { background: #607D8B; }
    #cerrarMesaBtn { background: #607D8B; }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .header-section {
        flex-direction: column;
        padding: 10px;
      }
      .back-button {
        width: 100%;
        margin-bottom: 10px;
      }
      .logo-header {
        margin-top: 10px;
      }
      h1 {
        font-size: 1.8em;
      }
      #table-overview-container {
        height: auto; /* Altura automática para evitar overflow en pantallas pequeñas */
        flex-grow: 1;
      }
      #table-overview {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
      }
      .table-card {
        height: 100px;
      }
      .table-id {
        font-size: 1.8em;
      }
      .table-waiter {
        font-size: 0.9em;
      }
      .nav-btns {
        flex-direction: column;
      }
    }

    /* Modal emergente para confirmaciones - Compatible con WebView Android */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .modal-content {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin: 20px;
      max-width: 90%;
      max-height: 80%;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
      position: relative;
    }

    .modal-title {
      font-size: 1.5em;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 15px;
    }

    .modal-message {
      font-size: 1.1em;
      color: var(--text-color);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .modal-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 100px;
    }

    .modal-btn.confirm {
      background: #F44336;
      color: white;
    }

    .modal-btn.cancel {
      background: #607D8B;
      color: white;
    }

    .modal-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* Para WebView Android - asegurar que el modal esté siempre visible */
    @media (max-width: 480px) {
      .modal-content {
        margin: 10px;
        padding: 20px;
        max-width: 95%;
      }
      
      .modal-title {
        font-size: 1.3em;
      }
      
      .modal-message {
        font-size: 1em;
      }
      
      .modal-buttons {
        flex-direction: column;
      }
      
      .modal-btn {
        width: 100%;
        margin: 5px 0;
      }
    }
  </style>
</head>
<body>
  <div class="header-section">
    <button class="back-button" onclick="window.location.href='inicio.html'">Volver al Inicio</button>
    <div class="logo-header">
      <div class="logo-text">Mesas Abiertas</div>
    </div>
  </div>
  <div class="search-section">
    <h3>Buscar mesa</h3>
    <input type="number" id="mesaSearchInput" class="search-input" placeholder="Ej: 5, 12, etc.">
  </div>

  <div id="table-overview-container">
    <div id="table-overview"></div>
  </div>
  
  <div id="table-detail"></div>

  <!-- Modal para QR e impresión de cuenta -->
  <div id="cuentaModalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-title" id="cuentaModalTitle">Cuenta</div>
      <div class="modal-message" id="cuentaModalMsg"></div>
      <div id="qrContainer" style="display:none; justify-content:center; align-items:center; margin: 20px 0;"></div>
      <div class="modal-buttons" id="cuentaModalBtns">
        <button class="modal-btn" id="btnMostrarQR" style="background:#2196F3; color:white;">Mostrar QR</button>
        <button class="modal-btn" id="btnImprimirCuenta" style="background:#388E3C; color:white;">Imprimir cuenta</button>
        <button class="modal-btn cancel" id="btnCerrarCuentaModal">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    let tables = [];
    const overviewContainer = document.getElementById('table-overview-container');
    const overviewDiv = document.getElementById('table-overview');
    const detailDiv = document.getElementById('table-detail');
    const mesaSearchInput = document.getElementById('mesaSearchInput');

    // Función para mostrar modal emergente compatible con WebView Android
    function showModal(title, message, onConfirm, onCancel) {
      // Remover modal existente si hay uno
      const existingModal = document.querySelector('.modal-overlay');
      if (existingModal) {
        existingModal.remove();
      }

      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-content">
          <div class="modal-title">${title}</div>
          <div class="modal-message">${message}</div>
          <div class="modal-buttons">
            <button class="modal-btn confirm">Confirmar</button>
            <button class="modal-btn cancel">Cancelar</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);

      // Event listeners para los botones
      const confirmBtn = modal.querySelector('.modal-btn.confirm');
      const cancelBtn = modal.querySelector('.modal-btn.cancel');

      confirmBtn.addEventListener('click', () => {
        modal.remove();
        if (onConfirm) onConfirm();
      });

      cancelBtn.addEventListener('click', () => {
        modal.remove();
        if (onCancel) onCancel();
      });

      // Cerrar modal al hacer clic fuera de él
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.remove();
          if (onCancel) onCancel();
        }
      });

      // Prevenir scroll del body cuando el modal está abierto
      document.body.style.overflow = 'hidden';

      // Restaurar scroll cuando se cierra el modal
      const restoreScroll = () => {
        document.body.style.overflow = '';
      };

      confirmBtn.addEventListener('click', restoreScroll);
      cancelBtn.addEventListener('click', restoreScroll);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) restoreScroll();
      });
    }

    // Función para cerrar mesa con modal
    async function cerrarMesaConModal(table) {
      showModal(
        'Cerrar Mesa',
        `¿Estás seguro de cerrar la Mesa ${table.mesa}?<br><br>Esta acción enviará la solicitud de cierre al sistema.`,
        async () => {
          // Función que se ejecuta al confirmar
          await procesarCierreMesa(table);
        },
        () => {
          // Función que se ejecuta al cancelar
          console.log('Cierre de mesa cancelado por el usuario');
        }
      );
    }

    // Función principal para procesar el cierre de mesa
    async function procesarCierreMesa(table) {
      try {
        console.log('🚀 [Frontend Debug] Iniciando proceso de cierre de mesa');
        console.log('📋 [Frontend Debug] Datos de la mesa:', {
          mesa: table.mesa,
          "id-garzon": table["id-garzon"],
          personas: table.personas,
          horaApertura: table.horaApertura,
          productos: table.productos?.length || 0
        });

        // Obtener el botón de cerrar
        const btnCerrar = document.getElementById('cerrarMesaBtn');
        if (!btnCerrar) {
          throw new Error('Botón de cerrar mesa no encontrado');
        }

        // Deshabilitar botón y mostrar estado inicial
        btnCerrar.disabled = true;
        btnCerrar.textContent = 'Enviando archivo...';
        
        // Paso 1: Enviar archivo .txt con estructura /header y /estado
        console.log('📤 [Frontend Debug] Enviando solicitud de cierre al backend...');
        
        // Crear un timeout usando las variables CSS
        const timeoutMs = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--timeout-cierre-mesa')) || 3000;
        const timeoutPromise = new Promise((_, reject) => {
          setTimeout(() => reject(new Error('Timeout: No se recibió respuesta en ' + (timeoutMs/1000) + ' segundos')), timeoutMs);
        });
        
        const cerrarPromise = fetch(`${BACKEND_BASE_URL}/cerrar-mesa`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mesa: table.mesa,
            "id-garzon": table["id-garzon"],
            personas: table.personas,
            horaApertura: table.horaApertura
          })
        });

        // Ejecutar la solicitud con timeout
        const cerrarResponse = await Promise.race([cerrarPromise, timeoutPromise]);

        console.log('📥 [Frontend Debug] Respuesta del backend recibida:', {
          status: cerrarResponse.status,
          ok: cerrarResponse.ok
        });

        if (!cerrarResponse.ok) {
          const errorData = await cerrarResponse.json();
          console.error('❌ [Frontend Debug] Error en respuesta del backend:', errorData);
          throw new Error(errorData.error || 'Error al enviar archivo de cierre');
        }

        const cerrarData = await cerrarResponse.json();
        console.log('✅ [Frontend Debug] Archivo de cierre enviado exitosamente:', cerrarData);

        // Paso 2: Mostrar mensaje de espera
        btnCerrar.textContent = '⏳ Esperando confirmación del Linux...';
        document.getElementById('msgCuenta').textContent = '⏳ Esperando confirmación del Linux...';
        document.getElementById('msgCuenta').style.color = '#FF9800';

        // Paso 3: Consultar periódicamente el estado del Linux hasta recibir confirmación
        let intentos = 0;
        const maxIntentos = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--timeout-polling')) / 
                           parseInt(getComputedStyle(document.documentElement).getPropertyValue('--intervalo-polling')) || 60;
        const intervaloMs = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--intervalo-polling')) || 1000;
        
        const consultarEstadoLinux = async () => {
          try {
            console.log(`🔍 [Frontend Debug] Consultando estado del Linux para mesa ${table.mesa} (intento ${intentos + 1}/${maxIntentos})`);
            
            const estadoLinuxResponse = await fetch(`${BACKEND_BASE_URL}/estado-linux/${table.mesa}`, { cache: 'no-store' });
            console.log('📥 [Frontend Debug] Respuesta de consulta de estado del Linux:', {
              status: estadoLinuxResponse.status,
              ok: estadoLinuxResponse.ok
            });

            if (!estadoLinuxResponse.ok) {
              throw new Error('Error al consultar estado del Linux');
            }

            const estadoLinuxData = await estadoLinuxResponse.json();
            console.log(`📋 [Frontend Debug] Estado del Linux para mesa ${table.mesa}:`, estadoLinuxData);

            if (estadoLinuxData.estado && ["pagada", "pagado", "cerrada", "cerrado"].includes(estadoLinuxData.estado)) {
              // ✅ Linux confirma pago/cierre - proceder a cerrar mesa
              console.log('✅ [Frontend Debug] Linux confirma pago/cierre - procediendo a cerrar mesa');
              
              btnCerrar.textContent = '✅ Mesa cerrada con éxito';
              btnCerrar.style.background = '#4CAF50';
              document.getElementById('msgCuenta').textContent = '✅ Mesa cerrada con éxito (confirmado por Linux)';
              document.getElementById('msgCuenta').style.color = '#4CAF50';
              
              // Eliminar la mesa del sistema
              console.log('🗑️ [Frontend Debug] Eliminando mesa del sistema...');
              const deleteResponse = await fetch(`${BACKEND_BASE_URL}/mesas/${table.mesa}`, {
                method: 'DELETE'
              });
              
              if (deleteResponse.ok) {
                console.log('✅ [Frontend Debug] Mesa eliminada del sistema exitosamente');
              } else {
                console.warn('⚠️ [Frontend Debug] Error al eliminar mesa del sistema');
              }
              
              // Limpiar archivo de estado del Linux
              try {
                const limpiarEstadoResponse = await fetch(`${BACKEND_BASE_URL}/limpiar-estado-linux/${table.mesa}`, {
                  method: 'DELETE'
                });
                if (limpiarEstadoResponse.ok) {
                  console.log('🧹 [Frontend Debug] Archivo de estado del Linux limpiado');
                }
              } catch (e) {
                console.warn('⚠️ [Frontend Debug] No se pudo limpiar archivo de estado del Linux');
              }
              
              // Volver a la vista general después de 1 segundo
              setTimeout(() => {
                console.log('🔄 [Frontend Debug] Volviendo a la vista general...');
                fetchMesasAbiertas();
                detailDiv.style.display = 'none';
                overviewContainer.style.display = 'flex';
              }, 1000);
              
              return; // Salir del polling
            } else if (estadoLinuxData.estado && ["abierta", "abierto"].includes(estadoLinuxData.estado)) {
              // 🕓 Linux indica que la mesa sigue abierta
              console.log('🕓 [Frontend Debug] Linux indica que la mesa sigue abierta');
              btnCerrar.textContent = '🕓 Mesa aún abierta (Linux)';
              btnCerrar.style.background = '#FF9800';
              document.getElementById('msgCuenta').textContent = '🕓 Linux indica que la mesa sigue abierta';
              document.getElementById('msgCuenta').style.color = '#FF9800';
              
              // Continuar consultando
              intentos++;
              if (intentos >= maxIntentos) {
                console.log('⏰ [Frontend Debug] Timeout alcanzado - Linux no confirma cierre');
                btnCerrar.textContent = '❌ Mesa Abierta - Reintentar';
                btnCerrar.disabled = false;
                btnCerrar.style.background = '#F44336';
                document.getElementById('msgCuenta').textContent = '❌ Timeout: Mesa Abierta - Reintentar en ' + (maxIntentos * intervaloMs / 1000) + ' segundos';
                document.getElementById('msgCuenta').style.color = '#F44336';
                return;
              }
              
              setTimeout(consultarEstadoLinux, intervaloMs);
            } else {
              // ⏳ Linux aún no ha respondido
              console.log('⏳ [Frontend Debug] Linux aún no ha enviado estado');
              intentos++;
              if (intentos >= maxIntentos) {
                console.log('⏰ [Frontend Debug] Timeout alcanzado - Linux no respondió');
                btnCerrar.textContent = '❌ Timeout - Reintentar';
                btnCerrar.disabled = false;
                btnCerrar.style.background = '#F44336';
                document.getElementById('msgCuenta').textContent = '❌ Timeout: Linux no respondió en ' + (maxIntentos * intervaloMs / 1000) + ' segundos';
                document.getElementById('msgCuenta').style.color = '#F44336';
                return;
              }
              
              setTimeout(consultarEstadoLinux, intervaloMs);
            }
          } catch (error) {
            console.error('❌ [Frontend Debug] Error al consultar estado del Linux:', error);
            intentos++;
            if (intentos >= maxIntentos) {
              console.log('⏰ [Frontend Debug] Timeout alcanzado por errores');
              btnCerrar.textContent = '❌ Error - Reintentar';
              btnCerrar.disabled = false;
              btnCerrar.style.background = '#F44336';
              document.getElementById('msgCuenta').textContent = '❌ Error al consultar estado del Linux';
              document.getElementById('msgCuenta').style.color = '#F44336';
              return;
            }
            
            // Continuar consultando en el intervalo configurado
            setTimeout(consultarEstadoLinux, intervaloMs);
          }
        };

        // Iniciar el polling del estado del Linux
        console.log('🔄 [Frontend Debug] Iniciando polling del estado del Linux...');
        setTimeout(consultarEstadoLinux, intervaloMs);

      } catch (error) {
        console.error('❌ [Frontend Debug] Error al cerrar mesa:', error);
        
        const btnCerrar = document.getElementById('cerrarMesaBtn');
        if (!btnCerrar) return;
        
        if (error.message.includes('Timeout')) {
          // Timeout en la solicitud inicial
          btnCerrar.textContent = '⏰ Timeout - Reintentar';
          btnCerrar.disabled = false;
          btnCerrar.style.background = '#FF9800';
          document.getElementById('msgCuenta').textContent = '⏰ Timeout: No se recibió respuesta en ' + (timeoutMs/1000) + ' segundos. Revisa los logs.';
          document.getElementById('msgCuenta').style.color = '#FF9800';
          
          // Agregar botón de consultar logs
          const logButton = document.createElement('button');
          logButton.textContent = '📋 Consultar Logs';
          logButton.style.cssText = `
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 16px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 0.9em;
          `;
          logButton.onclick = async () => {
            try {
              logButton.textContent = '📋 Consultando...';
              logButton.disabled = true;
              
              const logsResponse = await fetch(`${BACKEND_BASE_URL}/logs-cierre-mesa/${table.mesa}`);
              if (logsResponse.ok) {
                const logsData = await logsResponse.json();
                showModal(
                  'Logs de Cierre de Mesa',
                  `<pre style="text-align: left; font-size: 0.8em; max-height: 300px; overflow-y: auto;">${logsData.logs}</pre>`,
                  () => {}, // No hacer nada al confirmar
                  () => {}  // No hacer nada al cancelar
                );
              } else {
                showModal(
                  'Error',
                  '❌ No se pudieron obtener los logs',
                  () => {}, // No hacer nada al confirmar
                  () => {}  // No hacer nada al cancelar
                );
              }
            } catch (logError) {
              showModal(
                'Error',
                '❌ Error al consultar logs: ' + logError.message,
                () => {}, // No hacer nada al confirmar
                () => {}  // No hacer nada al cancelar
              );
            } finally {
              logButton.textContent = '📋 Consultar Logs';
              logButton.disabled = false;
            }
          };
          
          // Agregar botón de consultar logs de curl entrante
          const curlLogButton = document.createElement('button');
          curlLogButton.textContent = '🔍 Logs CURL Entrante';
          curlLogButton.style.cssText = `
            background: #9C27B0;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 16px;
            margin-top: 10px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 0.9em;
          `;
          curlLogButton.onclick = async () => {
            try {
              curlLogButton.textContent = '🔍 Consultando...';
              curlLogButton.disabled = true;
              
              const curlLogsResponse = await fetch(`${BACKEND_BASE_URL}/logs-curl-entrante/${table.mesa}`);
              if (curlLogsResponse.ok) {
                const curlLogsData = await curlLogsResponse.json();
                showModal(
                  'Logs de CURL Entrante - Mesa ' + table.mesa,
                  `<pre style="text-align: left; font-size: 0.8em; max-height: 400px; overflow-y: auto;">${curlLogsData.logs}</pre>`,
                  () => {}, // No hacer nada al confirmar
                  () => {}  // No hacer nada al cancelar
                );
              } else {
                showModal(
                  'Error',
                  '❌ No se pudieron obtener los logs de CURL',
                  () => {}, // No hacer nada al confirmar
                  () => {}  // No hacer nada al cancelar
                );
              }
            } catch (curlLogError) {
              showModal(
                'Error',
                '❌ Error al consultar logs de CURL: ' + curlLogError.message,
                () => {}, // No hacer nada al confirmar
                () => {}  // No hacer nada al cancelar
              );
            } finally {
              curlLogButton.textContent = '🔍 Logs CURL Entrante';
              curlLogButton.disabled = false;
            }
          };
          
          // Insertar los botones después del mensaje
          const msgDiv = document.getElementById('msgCuenta');
          msgDiv.appendChild(document.createElement('br'));
          msgDiv.appendChild(logButton);
          msgDiv.appendChild(curlLogButton);
        } else {
          // Otro tipo de error
          btnCerrar.textContent = '❌ Error - Reintentar';
          btnCerrar.disabled = false;
          btnCerrar.style.background = '#F44336';
          document.getElementById('msgCuenta').textContent = '❌ Error al cerrar la mesa: ' + error.message;
          document.getElementById('msgCuenta').style.color = '#F44336';
        }
      }
    }

    function fetchMesasAbiertas() {
      fetch(`${BACKEND_BASE_URL}/mesas`, { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
          tables = Object.values(data);
          tables.sort((a, b) => parseInt(a.mesa) - parseInt(b.mesa)); // Ordenar por número de mesa
          renderOverview(tables); // Renderizar todas las mesas al inicio
        })
        .catch(() => {
          overviewDiv.innerHTML = '<div style="font-size:1.2em;color:#888;margin:40px auto; text-align: center;">No se pudo conectar al servidor.</div>';
        });
    }

    function renderOverview(filteredTables) {
      detailDiv.style.display = 'none';
      overviewContainer.style.display = 'flex'; // Asegura que el contenedor flex se muestre
      overviewDiv.innerHTML = ''; // Limpiar antes de renderizar
      
      if (filteredTables.length === 0) {
        overviewDiv.innerHTML = '<div style="font-size:1.2em;color:#888;margin:40px auto; text-align: center;">No hay mesas abiertas actualmente.</div>';
        return;
      }

      filteredTables.forEach(table => {
        const card = document.createElement('div');
        card.className = 'table-card';
        card.setAttribute('data-status', 'open'); // Mantener para futuros estados si es necesario
        card.onclick = () => showDetail(table.mesa);
        card.innerHTML = `
          <div class="table-id">Mesa ${table.mesa}</div>
          <div class="table-waiter">Garzón: ${table.garzon}</div>
        `;
        overviewDiv.appendChild(card);
      });
    }

    function showDetail(mesaId) {
      const table = tables.find(t => t.mesa == mesaId);
      if (!table) return;

      overviewContainer.style.display = 'none'; // Ocultar el contenedor de la vista general
      detailDiv.style.display = 'block';

      const total = (table.productos || []).reduce((sum, item) => sum + (parseFloat(item.precio) * (item.cantidad || 1)), 0);
      const cuentaEmitida = table.cuenta_emitida; // Mantener por si se usa en el futuro

      detailDiv.innerHTML = `
        <h2>Mesa ${table.mesa}</h2>
        <div><span class="detail-label">Garzón:</span> <span class="detail-value">${table.garzon}</span></div>
        <div><span class="detail-label">Ocupantes:</span> <span class="detail-value">${table.personas}</span></div>
        <div><span class="detail-label">Hora de apertura:</span> <span class="detail-value">${table.horaApertura || ''}</span></div>
        <div style="margin: 16px 0 8px 0;"><span class="detail-label">Consumo:</span></div>
        ${table.productos && table.productos.length > 0 ? `
        <table class="order-items-table">
          <thead>
            <tr><th>Cantidad</th><th>Producto</th><th>Precio</th></tr>
          </thead>
          <tbody>
            ${table.productos.map(item => `
              <tr>
                <td>${item.cantidad}</td>
                <td>${item.nombre}</td>
                <td>$${item.precio}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ` : '<div style="color:#888; text-align: center;">Sin productos en la comanda.</div>'}
        <div style="margin-top:10px; text-align: right;"><span class="detail-label">Total:</span> <span class="detail-value" id="totalMesa">$${total}</span></div>
        <div class="nav-btns">
          <button id="emitirCuentaBtn">EMITIR CUENTA</button>
          <button id="cerrarMesaBtn">Cerrar Mesa</button>
        </div>
        <div id="msgCuenta" style="margin-top:10px;color:#4CAF50; text-align: center;"></div>
      `;

      // Lógica del botón EMITIR CUENTA (adaptada)
      const btnEmitir = document.getElementById('emitirCuentaBtn');
      if (btnEmitir) {
        if (cuentaEmitida) {
          btnEmitir.disabled = true;
          btnEmitir.textContent = 'Cuenta Solicitada';
          btnEmitir.style.background = '#ccc';
        }
        btnEmitir.onclick = async function() {
          btnEmitir.disabled = true;
          btnEmitir.textContent = 'Enviando...';
          try {
            const resp = await fetch(`${BACKEND_BASE_URL}/emitir-cuenta`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ mesa: table.mesa })
            });
            const data = await resp.json();
            if (!data.success || !data.url) throw new Error('No se pudo generar la cuenta');
            // Generar la URL del PDF en vez del HTML
            const pdfUrl = data.url.replace(/\/cuentas\/mesa-(\d+)\.html$/, '/cuenta-pdf/$1');
            mostrarModalCuenta(pdfUrl, table);
            btnEmitir.textContent = 'Cuenta Emitida';
            btnEmitir.disabled = false;
            btnEmitir.style.background = '#ccc';
          } catch (e) {
            document.getElementById('msgCuenta').textContent = 'Error al emitir cuenta.';
            btnEmitir.textContent = 'EMITIR CUENTA';
            btnEmitir.disabled = false;
          }
        };
      }

      // Lógica del botón Cerrar Mesa
      const btnCerrar = document.getElementById('cerrarMesaBtn');
      if (btnCerrar) {
        btnCerrar.onclick = async function() {
          await cerrarMesaConModal(table);
        };
      }
    }

    // Funcionalidad de búsqueda
    mesaSearchInput.addEventListener('input', () => {
      const searchTerm = mesaSearchInput.value.trim();
      if (searchTerm === '') {
        renderOverview(tables); // Si el buscador está vacío, mostrar todas las mesas
      } else {
        const filtered = tables.filter(table => String(table.mesa).includes(searchTerm));
        renderOverview(filtered); // Mostrar solo las mesas que coinciden con la búsqueda
      }
    });

    window.fetchMesasAbiertas = fetchMesasAbiertas;
    window.showDetail = showDetail;
    window.goHome = function() {
      window.location.href = 'inicio.html';
    };

    // --- Modal QR/Imprimir cuenta ---
    function mostrarModalCuenta(urlCuenta, table) {
      const overlay = document.getElementById('cuentaModalOverlay');
      const title = document.getElementById('cuentaModalTitle');
      const msg = document.getElementById('cuentaModalMsg');
      const qrDiv = document.getElementById('qrContainer');
      const btns = document.getElementById('cuentaModalBtns');
      const btnQR = document.getElementById('btnMostrarQR');
      const btnImprimir = document.getElementById('btnImprimirCuenta');
      const btnCerrar = document.getElementById('btnCerrarCuentaModal');
      // Reset
      qrDiv.innerHTML = '';
      qrDiv.style.display = 'none';
      title.textContent = `Cuenta Mesa ${table.mesa}`;
      msg.innerHTML = `Elige una opción para entregar la cuenta al cliente:`;
      overlay.style.display = 'flex';
      // Mostrar QR
      btnQR.onclick = function() {
        qrDiv.innerHTML = '';
        qrDiv.style.display = 'flex';
        msg.innerHTML = `<div style='margin-bottom:10px;'>Escanea este código QR para ver la cuenta en tu teléfono:</div><div style='font-size:0.9em;word-break:break-all;'>${urlCuenta}</div>`;
        new QRCode(qrDiv, {
          text: urlCuenta,
          width: 220,
          height: 220,
          colorDark: '#222',
          colorLight: '#fff',
          correctLevel: QRCode.CorrectLevel.H
        });
      };
      // Imprimir cuenta (enviar .txt al backend antiguo)
      btnImprimir.onclick = async function() {
        btnImprimir.disabled = true;
        btnImprimir.textContent = 'Enviando...';
        try {
          // Puedes parametrizar los datos si lo deseas
          const resp = await fetch(`${BACKEND_BASE_URL}/emitir-cuenta-txt`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mesa: table.mesa, "id-garzon": table["id-garzon"], personas: table.personas, horaApertura: table.horaApertura })
          });
          const data = await resp.json();
          if (data.success) {
            msg.innerHTML = 'Cuenta enviada a impresión correctamente.';
          } else {
            msg.innerHTML = 'Error al imprimir la cuenta.';
          }
        } catch (e) {
          msg.innerHTML = 'Error al imprimir la cuenta.';
        }
        btnImprimir.disabled = false;
        btnImprimir.textContent = 'Imprimir cuenta';
      };
      // Cerrar modal
      btnCerrar.onclick = function() {
        overlay.style.display = 'none';
        qrDiv.innerHTML = '';
        qrDiv.style.display = 'none';
      };
      // Cerrar modal al tocar fuera (WebView compatible)
      overlay.onclick = function(e) {
        if (e.target === overlay) {
          overlay.style.display = 'none';
          qrDiv.innerHTML = '';
          qrDiv.style.display = 'none';
        }
      };
      // Prevenir scroll del body
      document.body.style.overflow = 'hidden';
      overlay.ontransitionend = function() { document.body.style.overflow = ''; };
    }

    fetchMesasAbiertas();
  </script>
</body>
</html>
