<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="../config.js"></script>
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/gerencia.css">
</head>
<body>
  <div class="header-section">
    <button class="back-button" onclick="window.location.href='inicio.html'">Volver al Inicio</button>
    <div class="logo-header">
      <div class="logo-text">Panel de Administración</div>
    </div>
  </div>
  <div class="search-section">
    <h3>Buscar mesa</h3>
    <input type="number" id="mesaSearchInput" class="search-input" placeholder="Ej: 5, 12, etc.">
  </div>
  <div id="table-overview-container">
    <div id="table-overview"></div>
  </div>
  <div id="table-detail"></div>
  <!-- Modal de Detalle de Mesa -->
  <div class="table-detail-modal-overlay" id="tableDetailModal">
    <div class="table-detail-modal-content">
      <h3 id="detailMesaId"></h3>
      <div class="table-detail-info">
        <p><strong>Garzón:</strong> <span id="detailGarzon"></span></p>
        <p><strong>Personas:</strong> <span id="detailPersonas"></span></p>
        <p><strong>Hora Apertura:</strong> <span id="detailHoraApertura"></span></p>
      </div>
      
      <h4>Productos en Comanda:</h4>
      <div id="detailProductsMessage" class="message"></div>
      <table class="table-detail-products-table">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio Unit.</th>
            <th>Mensaje</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="detailProductsBody">
          <!-- Productos se cargarán aquí -->
        </tbody>
      </table>
      <p style="margin-top: 15px;"><strong>Total:</strong> <span id="detailTotal"></span></p>

      <div class="modal-buttons">
        <button class="close-button" onclick="closeTableDetailModal()">Cerrar</button>
        <button class="delete-table-button" onclick="confirmDeleteTable()">Eliminar Mesa</button>
      </div>
      <div id="detailActionMessage" class="message"></div>
    </div>
  </div>

  <!-- Modal de Confirmación para Anulación/Movimiento -->
  <div class="confirmation-modal-overlay" id="confirmationModal">
    <div class="confirmation-modal-content">
      <h3 id="confirmationTitle"></h3>
      <div class="confirmation-info">
        <p><strong>Mesa:</strong> <span id="confirmationMesa"></span></p>
        <p><strong>Producto:</strong> <span id="confirmationProducto"></span></p>
        <p><strong>Cantidad:</strong> <span id="confirmationCantidad"></span></p>
        <p><strong>Precio:</strong> <span id="confirmationPrecio"></span></p>
      </div>
      
      <div class="confirmation-form">
        <label for="confirmationMotivo">Motivo del cambio o anulación:</label>
        <textarea id="confirmationMotivo" placeholder="Ingrese el motivo..." rows="4"></textarea>
        
        <div id="moveToMesaSection" style="display: none;">
          <label for="moveToMesa">Mover a mesa:</label>
          <input type="number" id="moveToMesa" placeholder="Número de mesa destino" min="1">
        </div>
      </div>
      
      <div class="confirmation-buttons">
        <button class="cancel-button" onclick="closeConfirmationModal()">Cancelar</button>
        <button class="confirm-button" id="confirmActionButton">Confirmar</button>
      </div>
      
      <div id="confirmationMessage" class="message"></div>
    </div>
  </div>

  <script>
    // 1. Verificación de Autenticación
    if (sessionStorage.getItem('adminAuthenticated') !== 'true') {
      window.location.href = 'inicio.html';
    }

    let tables = [];
    const overviewContainer = document.getElementById('table-overview-container');
    const overviewDiv = document.getElementById('table-overview');
    const detailDiv = document.getElementById('table-detail');
    const mesaSearchInput = document.getElementById('mesaSearchInput');
    const tableDetailModal = document.getElementById('tableDetailModal');
    const detailMesaId = document.getElementById('detailMesaId');
    const detailGarzon = document.getElementById('detailGarzon');
    const detailPersonas = document.getElementById('detailPersonas');
    const detailHoraApertura = document.getElementById('detailHoraApertura');
    const detailProductsBody = document.getElementById('detailProductsBody');
    const detailTotal = document.getElementById('detailTotal');
    const detailActionMessage = document.getElementById('detailActionMessage');
    const detailProductsMessage = document.getElementById('detailProductsMessage');
    
    // Variables para el modal de confirmación
    const confirmationModal = document.getElementById('confirmationModal');
    const confirmationTitle = document.getElementById('confirmationTitle');
    const confirmationMesa = document.getElementById('confirmationMesa');
    const confirmationProducto = document.getElementById('confirmationProducto');
    const confirmationCantidad = document.getElementById('confirmationCantidad');
    const confirmationPrecio = document.getElementById('confirmationPrecio');
    const confirmationMotivo = document.getElementById('confirmationMotivo');
    const moveToMesaSection = document.getElementById('moveToMesaSection');
    const moveToMesa = document.getElementById('moveToMesa');
    const confirmActionButton = document.getElementById('confirmActionButton');
    const confirmationMessage = document.getElementById('confirmationMessage');
    
    let currentTablesData = {};
    let currentMesaId = null;
    let currentAction = null; // 'anular' o 'mover'
    let currentProductIndex = null;

    // Funciones de utilidad para mensajes
    function showMessage(element, msg, type) {
      element.textContent = msg;
      element.className = `message ${type}`;
      element.style.display = 'block';
    }

    function hideMessage(element) {
      element.style.display = 'none';
      element.textContent = '';
      element.className = 'message';
    }

    // Cargar mesas y renderizar grid
    async function fetchMesasGerencia() {
      overviewDiv.innerHTML = '<div style="font-size:1.2em;color:#888;margin:40px auto; text-align: center;">Cargando mesas...</div>';
      try {
        const response = await fetch(`${BACKEND_BASE_URL}/mesas`);
        if (!response.ok) throw new Error('Error al cargar las mesas abiertas.');
        const data = await response.json();
        tables = Object.values(data);
        tables.sort((a, b) => parseInt(a.mesa) - parseInt(b.mesa));
        renderOverview(tables);
      } catch (e) {
        overviewDiv.innerHTML = '<div style="font-size:1.2em;color:#888;margin:40px auto; text-align: center;">No se pudo conectar al servidor.</div>';
      }
    }

    function renderOverview(filteredTables) {
      detailDiv.style.display = 'none';
      overviewContainer.style.display = 'flex';
      overviewDiv.innerHTML = '';
      if (filteredTables.length === 0) {
        overviewDiv.innerHTML = '<div style="font-size:1.2em;color:#888;margin:40px auto; text-align: center;">No hay mesas abiertas actualmente.</div>';
        return;
      }
      filteredTables.forEach(table => {
        const card = document.createElement('div');
        card.className = 'table-card';
        card.setAttribute('data-status', 'open');
        card.onclick = () => showTableDetail(table.mesa);
        card.innerHTML = `
          <div class="table-id">Mesa ${table.mesa}</div>
          <div class="table-waiter">Garzón: ${table.garzon}</div>
        `;
        overviewDiv.appendChild(card);
      });
    }

    // Búsqueda
    mesaSearchInput.addEventListener('input', () => {
      const searchTerm = mesaSearchInput.value.trim();
      if (searchTerm === '') {
        renderOverview(tables);
      } else {
        const filtered = tables.filter(table => String(table.mesa).includes(searchTerm));
        renderOverview(filtered);
      }
    });

    // 3. Mostrar Detalle de Mesa en Modal
    function showTableDetail(mesaId) {
      currentMesaId = mesaId;
      const table = tables.find(t => t.mesa == mesaId);
      if (!table) {
        showMessage(detailActionMessage, 'Error: Mesa no encontrada.', 'error');
        return;
      }

      detailMesaId.textContent = `Mesa ${table.mesa}`;
      detailGarzon.textContent = table.garzon;
      detailPersonas.textContent = table.personas;
      detailHoraApertura.textContent = table.horaApertura || 'N/A';
      
      detailProductsBody.innerHTML = ''; // Limpiar productos anteriores
      hideMessage(detailProductsMessage); // Ocultar mensajes de producto

      let total = 0;
      if (table.productos && table.productos.length > 0) {
        table.productos.forEach((product, index) => {
          const row = document.createElement('tr');
          const itemTotal = parseFloat(product.precio) * parseInt(product.cantidad, 10);
          total += itemTotal;
          row.innerHTML = `
            <td>${product.nombre}</td>
            <td>${product.cantidad}</td>
            <td>$${parseFloat(product.precio).toFixed(2)}</td>
            <td>${product.message || ''}</td>
            <td>
              <button class="action-button delete-button" onclick="showConfirmationModal('anular', ${index})">Eliminar</button>
              <button class="action-button move-button" onclick="showConfirmationModal('mover', ${index})">Mover</button>
            </td>
          `;
          detailProductsBody.appendChild(row);
        });
      } else {
        showMessage(detailProductsMessage, 'Esta mesa no tiene productos.', 'info');
      }
      detailTotal.textContent = `$${total.toFixed(2)}`;

      tableDetailModal.classList.add('visible');
    }

    function closeTableDetailModal() {
      tableDetailModal.classList.remove('visible');
      hideMessage(detailActionMessage);
      hideMessage(detailProductsMessage);
      currentMesaId = null;
    }

    // Cerrar modal al hacer clic fuera del contenido
    tableDetailModal.addEventListener('click', (e) => {
      if (e.target === tableDetailModal) {
        closeTableDetailModal();
      }
    });

    // 4. Modal de Confirmación para Anulación/Movimiento
    function showConfirmationModal(action, productIndex) {
      currentAction = action;
      currentProductIndex = productIndex;
      
      const table = tables.find(t => t.mesa == currentMesaId);
      const product = table.productos[productIndex];
      
      confirmationTitle.textContent = action === 'anular' ? 'Confirmar Anulación' : 'Confirmar Movimiento';
      confirmationMesa.textContent = currentMesaId;
      confirmationProducto.textContent = product.nombre;
      confirmationCantidad.textContent = product.cantidad;
      confirmationPrecio.textContent = `$${parseFloat(product.precio).toFixed(2)}`;
      
      // Mostrar/ocultar sección de mesa destino
      if (action === 'mover') {
        moveToMesaSection.style.display = 'block';
        moveToMesa.value = '';
      } else {
        moveToMesaSection.style.display = 'none';
      }
      
      confirmationMotivo.value = '';
      hideMessage(confirmationMessage);
      
      // Configurar botón de confirmación
      confirmActionButton.textContent = action === 'anular' ? 'Anular Producto' : 'Mover Producto';
      confirmActionButton.onclick = () => processAction();
      
      confirmationModal.classList.add('visible');
    }

    function closeConfirmationModal() {
      confirmationModal.classList.remove('visible');
      currentAction = null;
      currentProductIndex = null;
    }

    // Cerrar modal de confirmación al hacer clic fuera
    confirmationModal.addEventListener('click', (e) => {
      if (e.target === confirmationModal) {
        closeConfirmationModal();
      }
    });

    // 5. Procesar acción (anular o mover)
    async function processAction() {
      const motivo = confirmationMotivo.value.trim();
      if (!motivo) {
        showMessage(confirmationMessage, 'Debe ingresar un motivo.', 'error');
        return;
      }

      if (currentAction === 'mover') {
        const mesaDestino = moveToMesa.value.trim();
        if (!mesaDestino) {
          showMessage(confirmationMessage, 'Debe especificar la mesa destino.', 'error');
          return;
        }
        
        // Verificar que la mesa destino existe
        const mesaDestinoExists = tables.find(t => t.mesa == mesaDestino);
        if (!mesaDestinoExists) {
          showMessage(confirmationMessage, 'La mesa destino no existe.', 'error');
          return;
        }
        
        if (mesaDestino == currentMesaId) {
          showMessage(confirmationMessage, 'No puede mover a la misma mesa.', 'error');
          return;
        }
      }

      try {
        confirmActionButton.disabled = true;
        confirmActionButton.textContent = 'Procesando...';
        
        const table = tables.find(t => t.mesa == currentMesaId);
        const product = table.productos[currentProductIndex];
        
        // Generar archivo TXT según la acción
        const txtContent = generateTxtFile(currentAction, table, product, motivo);
        
        // Enviar al backend
        const response = await fetch(`${BACKEND_BASE_URL}/admin-action`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: currentAction,
            mesaOrigen: currentMesaId,
            mesaDestino: currentAction === 'mover' ? moveToMesa.value : null,
            productIndex: currentProductIndex,
            motivo: motivo,
            txtContent: txtContent
          })
        });

        if (!response.ok) {
          throw new Error('Error al procesar la acción');
        }

        const result = await response.json();
        
        if (result.success) {
          showMessage(confirmationMessage, `✅ ${currentAction === 'anular' ? 'Producto anulado' : 'Producto movido'} exitosamente.`, 'success');
          
          // Actualizar la vista
          await fetchMesasGerencia();
          if (currentMesaId) {
            showTableDetail(currentMesaId);
          }
          
          // Cerrar modal después de 2 segundos
          setTimeout(() => {
            closeConfirmationModal();
          }, 2000);
        } else {
          throw new Error(result.error || 'Error desconocido');
        }
        
      } catch (error) {
        console.error('Error al procesar acción:', error);
        showMessage(confirmationMessage, `❌ Error: ${error.message}`, 'error');
      } finally {
        confirmActionButton.disabled = false;
        confirmActionButton.textContent = currentAction === 'anular' ? 'Anular Producto' : 'Mover Producto';
      }
    }

    // 6. Generar archivo TXT
    function generateTxtFile(action, table, product, motivo) {
      const idGarzon = localStorage.getItem('id-garzon') || table['id-garzon'] || 'N/A';
      const hora = table.horaApertura || new Date().toLocaleTimeString();
      
      let content = `/header\n`;
      content += `${table.mesa}\n`;
      content += `${idGarzon}\n`;
      content += `${table.personas}\n`;
      content += `${hora}\n`;
      
      if (action === 'anular') {
        content += `/anulacion\n`;
        content += `${product.nombre}\n`;
        content += `-${product.cantidad}\n`; // Cantidad negativa
        content += `${product.precio}\n`;
        content += `${product.message || ''}\n`;
        content += `Motivo: ${motivo}\n`;
      } else if (action === 'mover') {
        content += `/cambio\n`;
        content += `${product.nombre}\n`;
        content += `${product.cantidad}\n`;
        content += `${product.precio}\n`;
        content += `${product.message || ''}\n`;
        content += `Mover a mesa: ${moveToMesa.value}\n`;
        content += `Motivo: ${motivo}\n`;
      }
      
      return content;
    }

    // 7. Eliminar Mesa Completa (mantener funcionalidad existente)
    async function confirmDeleteTable() {
      if (!currentMesaId) return;

      if (!confirm(`¿Estás seguro de ELIMINAR completamente la Mesa ${currentMesaId}? Esta acción es irreversible.`)) {
        return;
      }

      try {
        const response = await fetch(`${BACKEND_BASE_URL}/mesas/${currentMesaId}`, {
          method: 'DELETE',
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Error al eliminar la mesa.');
        }

        showMessage(detailActionMessage, `✅ Mesa ${currentMesaId} eliminada exitosamente.`, 'success');
        fetchMesasGerencia();
        closeTableDetailModal();
        alert(`Mesa ${currentMesaId} eliminada correctamente.`);
      } catch (error) {
        console.error('Error al eliminar mesa:', error);
        showMessage(detailActionMessage, `❌ Error al eliminar mesa: ${error.message}`, 'error');
      }
    }

    // Cargar mesas al inicio
    document.addEventListener('DOMContentLoaded', fetchMesasGerencia);
  </script>
</body>
</html>
